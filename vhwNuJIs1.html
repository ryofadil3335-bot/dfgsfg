<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
* {box-sizing:border-box}
body {
    margin:0;
    background:#050505;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.player {
    width:100%;
    max-width:950px;
    position:relative;
}
video {
    width:100%;
    height:auto;
    display:block;
    background:#000;
}
#playButton {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:15px 35px;
    border:0;
    border-radius:8px;
    background:#e00000;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="player">
    <video id="video" controls playsinline preload="metadata">
        <source src="https://cdn.slicedrv.com/vhwNuJIs1.mp4" type="video/mp4">

    </video>
    <button id="playButton">PLAY VIDEO</button>
</div>

<script>
const video = document.getElementById("video");
const button = document.getElementById("playButton");

button.onclick = () => {
    video.play().catch(error => console.log(error));
};

video.onplay = () => button.style.display = "none";
video.onpause = () => {
    if (!video.ended) button.style.display = "block";
};
video.onended = () => button.style.display = "block";
</script>
